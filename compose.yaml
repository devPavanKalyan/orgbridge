services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orgbridge
      POSTGRES_USER: orgbridge
      POSTGRES_PASSWORD: orgbridge
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgbridge -d orgbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orgbridge-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: orgbridge-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - orgbridge-redis:/data

volumes:
  orgbridge-postgres:
  orgbridge-redis:
